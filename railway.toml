# Railway configuration — healthcheck for zero-downtime deploys
# Docs: https://docs.railway.com/config-as-code/reference

[deploy]
# ON_FAILURE = Railway auto-restarts if the process crashes/exits non-zero.
# Combined with the bot's internal infinite crash guard (which handles transient
# errors with backoff), this ensures true 24/7 uptime:
#   - Transient crashes: bot's internal guard retries with backoff
#   - Fatal crashes (OOM kill, segfault): Railway restarts the container
# maxRetries = 10 gives Railway plenty of attempts before giving up.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/health"
healthcheckTimeout = 300
