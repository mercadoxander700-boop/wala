# Railway configuration — healthcheck for zero-downtime deploys
# Docs: https://docs.railway.com/config-as-code/reference

[deploy]
# NEVER = let the bot's internal crash guard handle all retries.
# ON_FAILURE caused Railway to restart on top of the bot's own retries,
# creating double-restart loops that overheat the container.
restartPolicyType = "NEVER"
restartPolicyMaxRetries = 3
healthcheckPath = "/health"
healthcheckTimeout = 300
